<div class="container mt-5">
  <br>
  <div class="nk-block">
    <div class="nk-block-between">
        <div class="nk-block-head-content">
            <h4 class="nk-block-title">{{roleDetails()? 'Update':'Create'}} Role and Permissions</h4>
            <div class="nk-block-des">
                <p>Create new roles and give him permissions</p>
            </div>
        </div>
        
        <div class="nk-block-head-content">
            
            
        </div><!-- .nk-block-head-content -->
    </div><!-- .nk-block-between -->
</div><!-- .nk-block-head -->
  <div class="card mt-4">
    
    <div class="card-body">
      <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
        <app-input controlName="role" label="Role Name" />
        <div formGroupName="permission">

          <!-- Permissions Section -->
          <div class="mb-4" formGroupName="dashboard">
            <div class="form-check">
              <input formControlName="view" class="form-check-input" type="checkbox" id="flexCheckDefault">
              <label class="form-check-label" for="flexCheckDefault">
                <h5 class="text-secondary">Dashboard</h5>
              </label>
            </div> 
            <div class="row">
              <div class="col-md-4"><app-check-box controlName="totalUser" title="View Total User" /></div>
              <div class="col-md-4"><app-check-box controlName="totalPendingEvent" title="View Pending Event" /></div>
              <div class="col-md-4"><app-check-box controlName="totalActiveEvent" title="View Active Event" /></div>
              <div class="col-md-4"><app-check-box controlName="totalEventJoins" title="View Event Joins" /></div>
            </div>
            <hr />
          </div>

          <div class="mb-4" formGroupName="user">
            <div class="form-check">
              <input formControlName="view" class="form-check-input" type="checkbox" id="flexCheckDefault">
              <label class="form-check-label" for="flexCheckDefault">
                <h5 class="text-secondary">User</h5>
              </label>
            </div> 
            <div class="row">
              <div class="col-md-4"><app-check-box controlName="create" title="Create" /></div>
              <div class="col-md-4"><app-check-box controlName="edit" title="Edit" /></div>
              <div class="col-md-4"><app-check-box controlName="delete" title="Delete" /></div>
            </div>
            <hr />
          </div>
          
          <div class="mb-4" formGroupName="event">
            <div class="form-check">
              <input formControlName="view" class="form-check-input" type="checkbox" id="flexCheckDefault">
              <label class="form-check-label" for="flexCheckDefault">
                <h5 class="text-secondary">Events</h5>
              </label>
            </div> 
            <div class="row">
              <div class="col-md-4"><app-check-box controlName="create" title="Create" /></div>
              <div class="col-md-4"><app-check-box controlName="edit" title="Edit" /></div>
              <div class="col-md-4"><app-check-box controlName="delete" title="Delete" /></div>
              <div class="col-md-4"><app-check-box controlName="approved" title="approve" /></div>
              <div class="col-md-4"><app-check-box controlName="join" title="Join" /></div>
            </div>
            <hr />
          </div>
          <div class="mb-4" formGroupName="role">
            <div class="form-check">
              <input formControlName="view" class="form-check-input" type="checkbox" id="flexCheckDefault">
              <label class="form-check-label" for="flexCheckDefault">
                <h5 class="text-secondary">Roles</h5>
              </label>
            </div> 
            <div class="row">
              <div class="col-md-4"><app-check-box controlName="create" title="Create" /></div>
              <div class="col-md-4"><app-check-box controlName="edit" title="Edit" /></div>
              <div class="col-md-4"><app-check-box controlName="delete" title="Delete" /></div>
            </div>
            <hr />
          </div>
        </div>

        <!-- Submit Button -->
         <!-- @if (userInfo()?.role?.permission?.role?.edit) { -->
          <app-button type="submit" [title]="roleDetails()? 'Update Role': 'Save Role'" class="btn btn-primary mt-3" [isLoading]="isLoading()" [disable]="roleForm.invalid"/>
         <!-- } -->
        
      </form>
    </div>
  </div>
</div>
