<div class="container mt-5">
    <br><br>
    <div class="card">
      <div class="card-header bg-primary text-white">
        <h4>Role and Permissions</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
          <!-- Role Name -->
          <div class="mb-4">
            <label for="roleName" class="form-label">Role Name</label>
            <input
              id="roleName"
              type="text"
              class="form-control"
              formControlName="role"
              placeholder="Enter role name"
            />
          </div>
  
          <!-- Permissions Section -->
          <div *ngFor="let section of permissionSections" class="mb-4">
            <h5 class="text-secondary">{{ section.label }}</h5>
            <div class="row">
              <div *ngFor="let perm of section.permissions" class="col-md-4">
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [formControlName]="perm.key"
                    [id]="perm.key"
                  />
                  <label class="form-check-label" [for]="perm.key">
                    {{ perm.label }}
                  </label>
                </div>
              </div>
            </div>
            <hr />
          </div>
  
          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary mt-3" [disabled]="roleForm.invalid">
            Save Role
          </button>
        </form>
      </div>
    </div>
  </div>
